name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: trackviewmedia-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      THORIUM_EXTENSION_KEY_B64: ${{ secrets.THORIUM_EXTENSION_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome for popup smoke test
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - name: Require and verify Thorium signing key
        shell: bash
        run: |
          if [ -z "$THORIUM_EXTENSION_KEY_B64" ]; then
            echo "::error::THORIUM_EXTENSION_KEY_B64 is required for stable releases"
            exit 1
          fi
          mkdir -p keys
          printf '%s' "$THORIUM_EXTENSION_KEY_B64" | base64 --decode > keys/thorium-extension.pem
          chmod 600 keys/thorium-extension.pem
          node scripts/setup-thorium-key.mjs --key keys/thorium-extension.pem

      - name: Test and build
        run: |
          npm test
          npm run build
          npm run test:popup

      - name: Package Chromium and unsigned Firefox builds
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          (cd dist && zip -qr "../release/TrackViewMedia-Chrome-v${VERSION}.zip" .)
          (cd dist-firefox && zip -qr "../release/TrackViewMedia-Firefox-v${VERSION}-unsigned.xpi" .)
          (cd dist-thorium && zip -qr "../release/TrackViewMedia-Thorium-v${VERSION}-unpacked.zip" .)

      - name: Package signed Thorium CRX
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          chrome --pack-extension="$PWD/dist-thorium" --pack-extension-key="$PWD/keys/thorium-extension.pem" --no-sandbox
          test -f dist-thorium.crx
          mv dist-thorium.crx "release/TrackViewMedia-Thorium-v${VERSION}.crx"
          node scripts/setup-thorium-key.mjs \
            --key keys/thorium-extension.pem \
            --crx "release/TrackViewMedia-Thorium-v${VERSION}.crx" \
            --output release/thorium-updates.xml

      - name: Sign Firefox build with AMO
        if: ${{ env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != '' }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p signed
          npx --yes web-ext@8 sign \
            --source-dir dist-firefox \
            --artifacts-dir signed \
            --channel unlisted \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET"
          SIGNED_XPI=$(find signed -maxdepth 1 -type f -name '*.xpi' | head -n 1)
          test -n "$SIGNED_XPI"
          cp "$SIGNED_XPI" "release/TrackViewMedia-Firefox-v${VERSION}.xpi"

      - name: Create checksums
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes

      - name: Verify published Thorium CRX
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ASSET="TrackViewMedia-Thorium-v${VERSION}.crx"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$ASSET"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${ASSET}"
          curl --fail --location --retry 3 --output /tmp/published.crx "$URL"
          test "$(sha256sum "release/${ASSET}" | cut -d' ' -f1)" = "$(sha256sum /tmp/published.crx | cut -d' ' -f1)"

      - name: Publish stable Thorium update feed
        shell: bash
        run: |
          cp release/thorium-updates.xml /tmp/thorium-updates.xml
          git fetch origin main
          git switch --force-create update-feed origin/main
          VERSION=$(node -p "require('./package.json').version")
          CURRENT_VERSION=$(node -e 'const fs=require("fs"); const xml=fs.readFileSync("thorium-updates.xml","utf8"); console.log(xml.match(/<updatecheck\\b[^>]*\\bversion="([^"]+)"/)?.[1] ?? "0.0.0")')
          if [ "$(printf '%s\n%s\n' "$CURRENT_VERSION" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "Stable Thorium feed is already newer (${CURRENT_VERSION}); leaving it unchanged."
            exit 0
          fi
          cp /tmp/thorium-updates.xml thorium-updates.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thorium-updates.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Thorium update ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
